# Denny Express — Nginx Server Block
# Place in: /etc/nginx/sites-available/dennyexpress.co.za
# Then: sudo ln -s /etc/nginx/sites-available/dennyexpress.co.za /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dennyexpress.co.za www.dennyexpress.co.za;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dennyexpress.co.za www.dennyexpress.co.za;

    # SSL — generated by Certbot, adjust paths after running certbot
    ssl_certificate     /etc/letsencrypt/live/dennyexpress.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dennyexpress.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Laravel root
    root /var/www/dennyexpress/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 256;

    # Static assets — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Let's Encrypt challenge
    location ~ /\.well-known/acme-challenge/ {
        allow all;
    }

    # Hidden files — deny
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to sensitive paths
    location ~ ^/(storage/app|storage/framework|storage/logs|bootstrap/cache|vendor|node_modules|.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to env files
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/dennyexpress-access.log;
    error_log  /var/log/nginx/dennyexpress-error.log;
}
