; Denny Express — Queue Worker (Supervisor)
; Place in: /etc/supervisor/conf.d/dennyexpress-worker.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start dennyexpress-worker:*

[program:dennyexpress-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dennyexpress/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/dennyexpress/storage/logs/queue-worker.log
stopwaitsecs=3600
